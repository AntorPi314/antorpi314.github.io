    <!--
      This inline script runs before React mounts, so the correct
      theme class is applied immediately and there is no visible
      "flash" of the wrong theme while the app boots up.
      It mirrors the exact logic used in ThemeContext.jsx.
    -->
    <script>
      (function () {
        try {
          var savedTheme = window.localStorage.getItem('portfolio-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (prefersDark ? 'dark' : 'light');

          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // If localStorage is unavailable (e.g. privacy mode),
          // silently fall back to the default light theme.
        }
      })();
    </script>
